<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Project — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="nav">
    <a href="../index.html" class="nav-logo">Portfolio</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="../projects.html" class="active">Projects</a></li>
    </ul>
  </nav>

  <main id="project-detail" class="project-detail">
    <!-- Injected by JS -->
  </main>

  <!-- Next/Prev navigation -->
  <div class="project-nav" id="project-nav"></div>

  <footer class="footer">
    <p>Built with GitHub Pages · <a href="https://github.com">github.com/yourusername</a></p>
  </footer>

  <script src="../js/data.js"></script>
  <script>
    // Get project ID from filename
    const filename = location.pathname.split('/').pop().replace('.html','');
    const idx = projects.findIndex(p => p.id === filename);
    const project = projects[idx];

    if (!project) {
      document.getElementById('project-detail').innerHTML = '<div class="container"><p>Project not found.</p><a href="../projects.html">← Back</a></div>';
    } else {
      document.title = `${project.title} — Portfolio`;

      const detail = document.getElementById('project-detail');
      detail.innerHTML = `
        <div class="detail-hero">
          <img src="../${project.hero || project.thumb}" alt="${project.title}" class="detail-hero-img" onerror="this.src='../images/placeholder.svg'">
        </div>
        <div class="container detail-body">
          <a href="../projects.html" class="back-link">← All Projects</a>
          <div class="detail-meta">
            <span class="card-tag">${project.category}</span>
            <span class="card-year">${project.year}</span>
          </div>
          <h1 class="detail-title">${project.title}</h1>
          <p class="detail-intro">${project.summary}</p>

          <div class="detail-grid">
            ${project.tags ? `<div class="detail-info"><h4>Tags</h4><div class="tags">${project.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>` : ''}
            ${project.role ? `<div class="detail-info"><h4>My Role</h4><p>${project.role}</p></div>` : ''}
            ${project.tools ? `<div class="detail-info"><h4>Tools</h4><p>${project.tools}</p></div>` : ''}
            ${project.duration ? `<div class="detail-info"><h4>Duration</h4><p>${project.duration}</p></div>` : ''}
          </div>

          <div class="detail-content">
            ${project.description}
          </div>

          ${project.images && project.images.length ? `
            <div class="detail-gallery">
              <h2>Gallery</h2>
              <div class="gallery-grid">
                ${project.images.map(img => `<img src="../${img}" alt="" onerror="this.src='../images/placeholder.svg'">`).join('')}
              </div>
            </div>` : ''}

          ${project.link ? `<a href="${project.link}" target="_blank" class="btn-primary" style="margin-top:2rem;display:inline-block;">View Live Project →</a>` : ''}
        </div>
      `;

      // Prev/Next
      const nav = document.getElementById('project-nav');
      const prev = projects[idx - 1];
      const next = projects[idx + 1];
      nav.innerHTML = `
        <div class="container project-nav-inner">
          ${prev ? `<a href="${prev.id}.html" class="nav-project prev"><span>← Previous</span><strong>${prev.title}</strong></a>` : '<span></span>'}
          ${next ? `<a href="${next.id}.html" class="nav-project next"><span>Next →</span><strong>${next.title}</strong></a>` : '<span></span>'}
        </div>`;
    }
  </script>
</body>
</html>
