<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="site-brand">
          <span class="brand-icon">◈</span>
          <span class="brand-name">P-Projects</span>
        </div>

        <nav class="side-nav">
          <a href="index.html" class="side-link active">
            <span class="side-icon">⊞</span> Overview
          </a>
          <a href="#" class="side-link" id="nav-active" onclick="filterStatus('active');return false;">
            <span class="side-icon">◉</span> Active
            <span class="badge" id="badge-active">0</span>
          </a>
          <a href="#" class="side-link" id="nav-completed" onclick="filterStatus('completed');return false;">
            <span class="side-icon">✓</span> Completed
            <span class="badge" id="badge-completed">0</span>
          </a>
          <a href="#" class="side-link" id="nav-paused" onclick="filterStatus('paused');return false;">
            <span class="side-icon">⏸</span> Paused
            <span class="badge" id="badge-paused">0</span>
          </a>
          <a href="#" class="side-link" id="nav-planned" onclick="filterStatus('planned');return false;">
            <span class="side-icon">○</span> Planned
            <span class="badge" id="badge-planned">0</span>
          </a>
        </nav>

        <div class="side-divider"></div>

        <div class="side-section-label">Categories</div>
        <div id="cat-nav"></div>
      </div>

      <div class="sidebar-bottom">
        <a href="https://github.com/Pieter745/P-Projects" target="_blank" class="side-link">
          <span class="side-icon">↗</span> GitHub Repo
        </a>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">

      <!-- TOP BAR -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-heading" id="page-heading">All Projects</h1>
        </div>
        <div class="topbar-right">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" class="search-input" id="search" placeholder="Search projects…">
          </div>
        </div>
      </header>

      <!-- STATS ROW -->
      <div class="stats-row" id="stats-row"></div>

      <!-- GRID -->
      <div class="projects-grid" id="projects-grid"></div>

      <!-- EMPTY STATE -->
      <div class="empty-state" id="empty-state" style="display:none;">
        <span>No projects found</span>
      </div>

    </div>
  </div>

  <!-- PROJECT DRAWER -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer">
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
    <div class="drawer-content" id="drawer-content"></div>
  </aside>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
